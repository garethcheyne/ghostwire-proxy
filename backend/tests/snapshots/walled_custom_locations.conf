limit_req_zone $binary_remote_addr zone=ratelimit_11111111_2222_3333_4444_555555555555:10m rate=100r/s;

proxy_cache_path /var/cache/nginx/11111111_2222_3333_4444_555555555555 levels=1:2 keys_zone=cache_11111111_2222_3333_4444_555555555555:10m max_size=1g inactive=60m;

server {
    listen 80;
    server_name app.example.test;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 100m;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    set $proxy_host_id "11111111-2222-3333-4444-555555555555";
    set $honeypot_enabled "0";

    # Auth wall: wall-1
    set $auth_wall_id "wall-1";
    set $auth_wall_type "multi";
    set $auth_wall_name "Staff";
    # Auth portal - Static assets (theme: default)
    location /__auth/assets/ {
        alias /var/www/auth-portal/default/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /__auth/favicon.svg {
        alias /var/www/auth-portal/default/favicon.svg;
        add_header Cache-Control "public, max-age=3600";
    }

    # Auth portal - SPA fallback
    location /__auth/ {
        alias /var/www/auth-portal/default/;
        index index.html;
        try_files $uri $uri/ /__auth/index.html;
        add_header Cache-Control "no-cache";
    }

    # Auth portal - API endpoints (NO auth check)
    location /api/auth-portal/ {
        set $auth_portal_api "ghostwire-proxy-api:8000";
        proxy_pass http://$auth_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    
        # Ensure cookies are passed through and not cached
        proxy_pass_header Set-Cookie;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Traffic logging
    log_by_lua_file /usr/local/openresty/nginx/lua/traffic_logger.lua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /ws {
        access_by_lua_block {
            require('auth_wall').access()
            require('waf').access()
        }

        proxy_pass http://10.0.0.20:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* \.(png|jpg)$ {
        access_by_lua_block {
            require('auth_wall').access()
            require('waf').access()
        }

        proxy_cache cache_11111111_2222_3333_4444_555555555555;
        proxy_cache_valid 200 10m;

        proxy_pass http://10.0.0.20:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api {
        access_by_lua_block {
            require('auth_wall').access()
            require('waf').access()
        }

        limit_req zone=ratelimit_11111111_2222_3333_4444_555555555555 burst=10 nodelay;

        proxy_pass http://10.0.0.20:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    limit_req zone=ratelimit_11111111_2222_3333_4444_555555555555 burst=50 nodelay;

    location / {
        access_by_lua_block {
            require('auth_wall').access()
            require('waf').access()
        }
        proxy_pass http://10.0.0.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
