map $http_upgrade $gw_conn_66666666777788889999000000000000 {
    default upgrade;
    ''      "";
}

upstream upstream_66666666_7777_8888_9999_000000000000 {
    # Load balancing: Least connections
    zone upstream_66666666_7777_8888_9999_000000000000 64k;
    least_conn;
    server 10.0.1.1:8080;
    server 10.0.1.2:8080;
    server 10.0.1.3:8080;
    server 10.0.1.4:8080 backup;
    keepalive 32;
}

server {
    listen 80;
    server_name lb.example.test;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 100m;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    set $proxy_host_id "66666666-7777-8888-9999-000000000000";
    set $honeypot_enabled "0";

    # Auth wall: wall-2
    set $auth_wall_id "wall-2";
    set $auth_wall_type "multi";
    set $auth_wall_name "Staff";
    # Auth portal - Static assets (theme: default)
    location /__auth/assets/ {
        alias /var/www/auth-portal/default/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /__auth/favicon.svg {
        alias /var/www/auth-portal/default/favicon.svg;
        add_header Cache-Control "public, max-age=3600";
    }

    # Auth portal - SPA fallback
    location /__auth/ {
        alias /var/www/auth-portal/default/;
        index index.html;
        try_files $uri $uri/ /__auth/index.html;
        add_header Cache-Control "no-cache";
    }

    # Auth portal - API endpoints (NO auth check)
    location /api/auth-portal/ {
        set $auth_portal_api "ghostwire-proxy-api:8000";
        proxy_pass http://$auth_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    
        # Ensure cookies are passed through and not cached
        proxy_pass_header Set-Cookie;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /admin {
        access_by_lua_block { require('auth_wall').access() }

        proxy_pass http://10.0.0.20:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        access_by_lua_block { require('auth_wall').access() }
        proxy_pass http://upstream_66666666_7777_8888_9999_000000000000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gw_conn_66666666777788889999000000000000;

        # Try the next server when one fails (non-idempotent requests are not retried)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
