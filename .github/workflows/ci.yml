name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.15"
  NODE_VERSION: "26"

jobs:
  # ─────────────────────────────────────────────
  # Backend: lint + test
  # ─────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghostwire_test
          POSTGRES_USER: ghostwire
          POSTGRES_PASSWORD: testpassword
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostwire -d ghostwire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://ghostwire:testpassword@localhost:5432/ghostwire_test
          # conftest.py only uses TEST_DATABASE_URL (it drops every table after each test).
          TEST_DATABASE_URL: postgresql+asyncpg://ghostwire:testpassword@localhost:5432/ghostwire_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-ci
          ENCRYPTION_KEY: test-encryption-key-32-chars-min!!
          INTERNAL_AUTH_TOKEN: test-internal-token
          BACKUP_PATH: /tmp/ghostwire-backups
        run: |
          python -m pytest tests/ -v --tb=short -q

  # ─────────────────────────────────────────────
  # Migrations: a fresh install must reach head, and
  # recent migrations must go down and back up again
  # ─────────────────────────────────────────────
  migrations:
    name: Migrations (fresh install)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ghostwire_fresh
          POSTGRES_USER: ghostwire
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostwire -d ghostwire_fresh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ghostwire:testpassword@localhost:5432/ghostwire_fresh
      JWT_SECRET: test-jwt-secret-ci
      ENCRYPTION_KEY: test-encryption-key-32-chars-min!!

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upgrade an empty database to head
        run: alembic upgrade head

      - name: Down four steps and back up
        run: |
          alembic downgrade -4
          alembic current
          alembic upgrade head

      - name: Down to 0003 and back up
        run: |
          alembic downgrade 0003
          alembic upgrade head
          test "$(alembic current 2>/dev/null | awk '{print $1}')" = "$(alembic heads 2>/dev/null | awk '{print $1}')"

  # ─────────────────────────────────────────────
  # Generated nginx config: the snapshot server blocks
  # must pass `openresty -t` in the real proxy image
  # ─────────────────────────────────────────────
  nginx-config:
    name: Generated nginx config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build the proxy image
        run: docker build -t ghostwire-proxy-nginx:ci ./proxy

      - name: openresty -t on the snapshots
        run: |
          docker run --rm -v "$PWD/backend/tests/snapshots:/etc/nginx/conf.d/proxy-hosts:ro" --entrypoint openresty ghostwire-proxy-nginx:ci -t

  # ─────────────────────────────────────────────
  # Frontend: lint + build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The proxy image serves proxy/auth-portal as committed. A login page whose
      # script or stylesheet is missing from the repo renders as a blank page.
      - name: Auth portal assets are committed
        working-directory: proxy/auth-portal
        run: |
          missing=0
          for page in */index.html; do
            for ref in $(grep -oE '/__auth/[^"]+' "$page" | sed 's#^/__auth/##'); do
              [ -f "$(dirname "$page")/$ref" ] || { echo "::error file=proxy/auth-portal/$page::references missing $ref"; missing=1; }
            done
          done
          exit $missing

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8089
        run: pnpm build

  # ─────────────────────────────────────────────
  # Auth portal (frontend-authwall): type check + build
  # ─────────────────────────────────────────────
  auth-portal:
    name: Auth portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-authwall/default

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend-authwall/default/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend-authwall/default/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────
  # Docker: build all images (no push)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, migrations, nginx-config, frontend, auth-portal]
    if: github.event_name == 'push'

    strategy:
      matrix:
        service: [backend, frontend, proxy, updater]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: ghostwire-proxy-${{ matrix.service }}:${{ github.sha }}

  # ─────────────────────────────────────────────
  # Auto-tag: create git tag when VERSION changes
  # ─────────────────────────────────────────────
  # Scripts: shell syntax
  # ─────────────────────────────────────────────
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done


  # ─────────────────────────────────────────────
  # Python lint and format (ruff.toml). The same job in every Ghostwire repo with Python.
  # ─────────────────────────────────────────────
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
  # ─────────────────────────────────────────────
  # Release: when VERSION changes on main and everything above passes, tag v<VERSION> and
  # publish a GitHub release with notes. The same job in every Ghostwire app.
  # ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [backend, migrations, nginx-config, frontend, auth-portal, docker-build, scripts, python-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Release if VERSION changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD~1 -- VERSION; then echo "VERSION unchanged"; exit 0; fi
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Ghostwire Proxy $TAG" --generate-notes
