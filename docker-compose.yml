services:
  # PostgreSQL Database (hardened — no external access)
  ghostwire-proxy-postgres:
    image: postgres:16-alpine
    container_name: ghostwire-proxy-postgres
    restart: unless-stopped
    # No ports exposed — only reachable from internal network
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ghostwire_proxy}
      - POSTGRES_USER=${POSTGRES_USER:-ghostwire}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    labels:
      # Watchtower runs with WATCHTOWER_LABEL_ENABLE=true, so it only touches
      # containers that opt in. Only postgres and redis are worth opting in:
      # the other four services are built locally from this repo and have no
      # registry behind them, so watchtower could never pull a newer image for
      # them — those update by rebuilding, not by watchtower.
      # The tag is pinned to a major (16-alpine / 7-alpine), so this picks up
      # patch and minor releases, never a major upgrade.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ghostwire-proxy-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghostwire} -d ${POSTGRES_DB:-ghostwire_proxy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenResty Reverse Proxy (Ports 80, 443)
  ghostwire-proxy-nginx:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: ghostwire-proxy-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    # This is the only container reachable from the internet, so it gets the
    # tightest profile the workload allows. It was previously the *least*
    # hardened service in the stack — postgres and redis already had
    # no-new-privileges and a read-only root, while the edge had neither.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Bind 80/443 without running the workers as root.
      - NET_BIND_SERVICE
      # The master starts as root and drops each worker to `nobody`; without
      # these the workers cannot be spawned.
      - SETUID
      - SETGID
      # The entrypoint fixes ownership on the log and cache directories.
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - ./data/certificates:/etc/nginx/certs:ro
      - ./data/nginx-configs:/etc/nginx/conf.d/proxy-hosts:ro
      - proxy-cache:/var/cache/nginx
      - certbot-webroot:/var/www/certbot:ro
      - ./data/geoip:/data/geoip:ro
    networks:
      - ghostwire-proxy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin UI - Next.js (Port 88)
  ghostwire-proxy-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-unknown}
    container_name: ghostwire-proxy-ui
    restart: unless-stopped
    ports:
      - "88:3000"
    # Publishes a port, so it is an edge container by the same definition the
    # container scanner uses. Already runs as the unprivileged `nextjs` user on
    # port 3000, so it needs no capabilities at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./docs:/app/docs:ro
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - BACKEND_URL=http://ghostwire-proxy-api:8000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:88}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      ghostwire-proxy-api:
        condition: service_healthy
    networks:
      - ghostwire-proxy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API - FastAPI (Port 8089 external, 8000 internal)
  ghostwire-proxy-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghostwire-proxy-api
    restart: unless-stopped
    ports:
      - "8089:8000"
    # Also edge-facing. The entrypoint starts as root and hands off with
    # `gosu appuser`, so it keeps only the capabilities that handover needs —
    # verified that gosu still drops to uid 1000 under no-new-privileges, and
    # that the Docker socket stays usable for the container update feature.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    environment:
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ghostwire}:${POSTGRES_PASSWORD}@ghostwire-proxy-postgres:5432/${POSTGRES_DB:-ghostwire_proxy}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:88,http://localhost:3000}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-}
      - GHOSTWIRE_API_URL=${GHOSTWIRE_API_URL:-}
      - GHOSTWIRE_API_KEY=${GHOSTWIRE_API_KEY:-}
      - REDIS_URL=redis://ghostwire-proxy-redis:6379
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:admin@ghostwire.local}
    depends_on:
      ghostwire-proxy-postgres:
        condition: service_healthy
      ghostwire-proxy-redis:
        condition: service_healthy
    volumes:
      - ./VERSION:/app/VERSION:ro
      - ./data/certificates:/data/certificates
      - ./data/nginx-configs:/data/nginx-configs
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/backups:/data/backups
      - ./data/geoip:/data/geoip
      - certbot-webroot:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ghostwire-proxy-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NOTE: there used to be a standalone `ghostwire-proxy-certbot` container here
  # running its own independent `certbot renew` loop every 12h against the same
  # ./data/letsencrypt volume. It worked (it kept the underlying Let's Encrypt
  # certs renewed), but it never deployed the renewed cert anywhere — no deploy
  # hook, no API/DB update, no nginx reload — so nginx kept serving the
  # original cert until it expired, while a fresh renewed one sat unused right
  # next to it. It also risked racing with the API container's own certbot
  # calls against the same on-disk config/lock directory.
  #
  # The API container already bundles the `certbot` binary and mounts the same
  # /etc/letsencrypt + certbot-webroot volumes, and now runs its own
  # certificate_renewal_loop (see backend/app/main.py) that renews AND deploys
  # (writes cert files, regenerates nginx configs, reloads nginx) on a 12h
  # cycle. That replaces this container entirely — see enhancement/01.

  # Redis for caching and queues (hardened — no external access)
  ghostwire-proxy-redis:
    image: redis:7-alpine
    container_name: ghostwire-proxy-redis
    restart: unless-stopped
    # No ports exposed — only reachable from internal network
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    labels:
      # See the note on ghostwire-proxy-postgres. Pinned to redis:7-alpine, so
      # patch/minor only.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - redis-data:/data
    networks:
      - ghostwire-proxy-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Updater Sidecar - manages self-updates
  ghostwire-proxy-updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    container_name: ghostwire-proxy-updater
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://ghostwire-proxy-redis:6379
      - API_URL=http://ghostwire-proxy-api:8000
      - COMPOSE_PROJECT_DIR=/app/project
      - BACKUP_PATH=/data/backups
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INTERNAL_AUTH_TOKEN=${INTERNAL_AUTH_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Write access for updates
      - .:/app/project:ro                          # Project source (read-only)
      - ./data/backups:/data/backups               # For pre-update backups
    # Not edge-facing, but it holds write access to the Docker socket,
    # so it should not be able to gain privileges either. Capabilities
    # are left alone: it recreates containers as part of upgrades.
    security_opt:
      - no-new-privileges:true
    networks:
      - ghostwire-proxy-network
    depends_on:
      ghostwire-proxy-redis:
        condition: service_healthy
      ghostwire-proxy-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  ghostwire-proxy-network:
    name: ghostwire-proxy-network
    driver: bridge
    internal: false
    attachable: false

volumes:
  proxy-cache:
    name: ghostwire-proxy-cache
  certbot-webroot:
    name: ghostwire-proxy-certbot-webroot
  redis-data:
    name: ghostwire-proxy-redis-data
  postgres-data:
    name: ghostwire-proxy-postgres-data
